# Fine-grained GitHub token, stored in Vault:
#   vault kv put kv/agent/github token=github_pat_...
# The pod reads it as GH_TOKEN (optional, so the pod still starts while Vault
# is sealed; pushes fail until the Secret exists and the pod restarts).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: github-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: agent/github
        property: token
