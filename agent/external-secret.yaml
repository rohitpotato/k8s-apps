# Tokens for the agent, one ExternalSecret per Vault entry so a missing entry
# only breaks that one. All are optional in the pod spec, so it still starts
# while Vault is sealed.
#
# github-token is an env var: restart the pod after it changes. argocd-token
# and grafana-token are mounted as files, which the kubelet updates in place,
# so a rotated token reaches running sessions within a few minutes.
#
#   vault kv put kv/agent/github  token=github_pat_...
#   vault kv put kv/agent/argocd  token=$(argocd account generate-token --account agent)
#   vault kv put kv/agent/grafana token=glsa_...   # Grafana service account, Viewer
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: github-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: agent/github
        property: token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-token
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: argocd-token
    creationPolicy: Owner
    # `config` is an argocd CLI config file (ARGOCD_OPTS --config): the CLI
    # has no token-file flag, but it re-reads this file on every run.
    template:
      engineVersion: v2
      data:
        token: "{{ .token }}"
        config: |
          contexts:
            - name: argocd-server.argocd.svc:80
              server: argocd-server.argocd.svc:80
              user: argocd-server.argocd.svc:80
          current-context: argocd-server.argocd.svc:80
          servers:
            - server: argocd-server.argocd.svc:80
              grpc-web: true
              plain-text: true
          users:
            - name: argocd-server.argocd.svc:80
              auth-token: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: agent/argocd
        property: token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-token
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: agent/grafana
        property: token
