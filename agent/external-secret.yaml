# Tokens for the agent, one ExternalSecret per Vault entry so a missing entry
# only breaks that one. All are optional in the pod spec, so it still starts
# while Vault is sealed.
#
# github-token is an env var: restart the pod after it changes. argocd-token
# and grafana-token are mounted as files, which the kubelet updates in place,
# so a rotated token reaches running sessions within a few minutes (argocd
# reads its file through the agent/bin/argocd wrapper).
#
#   vault kv put kv/agent/github  token=github_pat_...
#   vault kv put kv/agent/argocd  token=$(argocd account generate-token --account agent)
#   vault kv put kv/agent/grafana token=glsa_...   # Grafana service account, Viewer
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: github-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: agent/github
        property: token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-token
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: argocd-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: agent/argocd
        property: token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-token
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: agent/grafana
        property: token
