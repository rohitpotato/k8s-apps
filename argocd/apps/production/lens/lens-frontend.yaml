apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lens-frontend
  namespace: argocd
  labels:
    name: lens
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: k8s-apps-project
  source:
    repoURL: https://github.com/rohitpotato/k8s-apps.git
    targetRevision: HEAD
    path: frontend/production/lens
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: frontend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true