# Was ~590Mi with no request (BestEffort), so first in line for eviction.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: argocd-application-controller
spec:
  template:
    metadata:
      annotations:
        # argocd-cmd-params-cm is read at startup only; bump this when
        # changing controller.* keys there so the controller restarts.
        argocd-cmd-params/revision: "1"
    spec:
      containers:
        - name: argocd-application-controller
          # Soft cap below the 1Gi limit so the Go GC trims the cluster
          # cache before the kernel OOM-kills the controller.
          env:
            - name: GOMEMLIMIT
              value: 800MiB
          resources:
            requests:
              cpu: 100m
              memory: 640Mi
            limits:
              memory: 1Gi
