nodeSelector:
  nodeRole: worker

# Pod anti-affinity for better distribution across worker nodes
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - kube-prometheus-stack
        topologyKey: kubernetes.io/hostname

grafana:
  enabled: true
  # Ensure Grafana runs on worker nodes with anti-affinity
  nodeSelector:
    nodeRole: worker
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
              - grafana
          topologyKey: kubernetes.io/hostname
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-production
      kubernetes.io/ingress.class: traefik
    hosts:
      - grafana.rohitpotato.xyz
    paths:
      - /
    pathType: Prefix
    tls:
    - secretName: grafana-tls
      hosts:
      - grafana.rohitpotato.xyz
  additionalDataSources:
    # - name: loki
    #   type: loki
    #   access: proxy
    #   url: http://loki.monitoring.svc.cluster.local:3100
    #   isDefault: false
    - name: monitor_boi
      type: postgres
      access: proxy
      url: postgres.postgres.svc.cluster.local:5432
      user: monospaced
      secureJsonData:
        password: 'monospaced'
      isDefault: false
      jsonData:
        database: monitor_boi
        sslmode: 'disable' # disable/require/verify-ca/verify-full
        timescaledb: false
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "200m"
  # Dashboard/datasource sidecars had no requests and made up most of
  # Grafana's footprint.
  sidecar:
    resources:
      requests:
        memory: "96Mi"
        cpu: "10m"
      limits:
        memory: "256Mi"
defaultRules:
  rules:
    # k3s runs etcd/controller-manager/scheduler/kube-proxy inside the k3s
    # binary; their scrapes are disabled below, so their rules would only
    # ever evaluate against nothing.
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false
    # Built on the apiserver histograms dropped below.
    kubeApiserverBurnrate: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false

kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

# Apiserver latency/size histograms are the largest series sets in the
# stack and nothing here reads them.
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      - sourceLabels: [__name__]
        action: drop
        regex: (apiserver_request_duration_seconds_bucket|apiserver_request_sli_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket|apiserver_watch_list_duration_seconds_bucket|etcd_request_duration_seconds_bucket)

# Resource limits for Prometheus stack components
prometheus:
  prometheusSpec:
    ruleSelector: {}
    ruleNamespaceSelector: {}
    retention: 3d
    retentionSize: 1500MB
    nodeSelector:
      nodeRole: worker
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                - prometheus
            topologyKey: kubernetes.io/hostname
    resources:
      requests:
        memory: "768Mi"
        cpu: "200m"
      limits:
        memory: "1536Mi"
        cpu: "400m"

alertmanager:
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-production
      kubernetes.io/ingress.class: traefik
      traefik.ingress.kubernetes.io/router.middlewares: default-redirect-https@kubernetescrd
    hosts:
      - alert-manager.rohitpotato.xyz
    paths:
      - /
    pathType: Prefix
    tls:
    - secretName: alertmanager-tls
      hosts:
      - alert-manager.rohitpotato.xyz
  alertmanagerSpec:
    alertmanagerConfigSelector: {}
    alertmanagerConfigNamespaceSelector: {}
    alertmanagerConfigMatcherStrategy:
      type: None
    # Ensure AlertManager runs on worker nodes with anti-affinity
    nodeSelector:
      nodeRole: worker
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                - alertmanager
            topologyKey: kubernetes.io/hostname
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"
