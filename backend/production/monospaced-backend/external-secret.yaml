# Resend credentials for the newsletter sign-up endpoint (POST /api/subscribe).
# Every property under kv/monospaced/resend becomes an env var, so name them
# exactly as the backend reads them:
#
#   vault kv put kv/monospaced/resend RESEND_API_KEY=re_... RESEND_SEGMENT_ID=<optional segment id>
#
# Env vars only load at pod start: restart the backend after changing them.
# The secret is optional in the pod spec, so the backend still starts while
# Vault is sealed (the endpoint returns 503 until the key is there).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: monospaced-backend-resend
  namespace: monospaced
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: monospaced-backend-resend
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: monospaced/resend
