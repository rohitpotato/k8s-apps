apiVersion: apps/v1
kind: Deployment
metadata:
  name: lens-backend
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lens-backend
  template:
    metadata:
      labels:
        app: lens-backend
        stack: lens
    spec:
      nodeSelector:
        nodeRole: worker
      # Spread lens-* pods across worker nodes so one node reboot doesn't take
      # the whole stack down. `ScheduleAnyway` keeps it functional on
      # single-node clusters; scales cleanly as workers are added.
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            stack: lens
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - lens-backend
              topologyKey: kubernetes.io/hostname
      # Migrations run once before the api container starts. `drizzle-kit migrate`
      # is idempotent — it reads the migrations table and applies only what's new,
      # so every pod restart is safe. Uses the api image (drizzle-kit ships in
      # node_modules) with a command override.
      initContainers:
        - name: db-migrate
          image: ghcr.io/rohitpotato/lens/backend:sha-47b8374
          imagePullPolicy: Always
          command: ["pnpm", "--filter", "@lens/db", "db:migrate"]
          envFrom:
            - secretRef:
                name: lens-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      containers:
        - name: lens-backend
          image: ghcr.io/rohitpotato/lens/backend:sha-47b8374
          imagePullPolicy: Always
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=256"
          envFrom:
            - secretRef:
                name: lens-secret
          ports:
            - name: http
              containerPort: 3001
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "200Mi"
              cpu: "100m"
            limits:
              memory: "400Mi"
              cpu: "300m"
