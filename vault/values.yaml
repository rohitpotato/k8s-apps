# No dataStorage block on purpose: the live PVC is the chart default (10Gi,
# default storageClass). volumeClaimTemplates are immutable, so pinning a
# different size here would break every sync of the StatefulSet.
server:
  ha:
    enabled: false
  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        address     = "0.0.0.0:8200"
        tls_disable = 1
      }
      storage "file" {
        path = "/vault/data"
      }
  nodeSelector:
    nodeRole: worker
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
              - vault
          topologyKey: kubernetes.io/hostname
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "400m"

ui:
  enabled: true

# Secrets reach pods via ESO; nothing uses the agent injector.
injector:
  enabled: false
