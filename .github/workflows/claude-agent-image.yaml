name: claude-agent image

on:
  push:
    branches: [main]
    paths:
      - images/claude-agent/**
      - .github/workflows/claude-agent-image.yaml
  # PRs build the image but do not push it.
  pull_request:
    paths:
      - images/claude-agent/**
      - .github/workflows/claude-agent-image.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Claude Code version from the Dockerfile
        id: version
        run: echo "claude=$(sed -n 's/^ARG CLAUDE_CODE_VERSION=//p' images/claude-agent/Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :<claude version> is what the StatefulSet runs (pullPolicy Always);
      # :sha-<commit> keeps every build addressable for rollbacks.
      - uses: docker/build-push-action@v6
        with:
          context: images/claude-agent
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/rohitpotato/k8s-apps/claude-agent:${{ steps.version.outputs.claude }}
            ghcr.io/rohitpotato/k8s-apps/claude-agent:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
