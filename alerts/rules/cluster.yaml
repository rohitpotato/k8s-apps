apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cluster-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: cluster-alerts
      rules:
        # All three nodes rebooted on 2026-10-18 and nobody noticed. Fires for
        # 15 minutes after a boot; node_uname_info supplies the node name.
        - alert: NodeRebooted
          expr: |
            (time() - node_boot_time_seconds < 900)
              * on (instance) group_left (nodename) node_uname_info
          labels:
            severity: critical
            team: platform
            service: "{{ $labels.nodename }}"
          annotations:
            summary: "Node {{ $labels.nodename }} rebooted in the last 15 minutes"
        - alert: ArgoAppOutOfSync
          expr: argocd_app_info{sync_status="OutOfSync"} == 1
          for: 30m
          labels:
            severity: critical
            team: platform
            service: "{{ $labels.name }}"
          annotations:
            summary: "Argo CD app {{ $labels.name }} has been OutOfSync for 30 minutes"
