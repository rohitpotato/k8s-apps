apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: monospaced-frontend-alerts
  namespace: monospaced
  labels:
      release: kube-prometheus-stack
spec:
  groups:
    - name: monospaced-frontend-alerts
      rules:
        - alert: MonospacedFrontendHighMemoryUsage
          # Per container against its own limit. The old fixed 5MiB pod-wide
          # threshold sat below normal usage (~50Mi), so it fired constantly.
          expr: |
            max by (pod, container) (container_memory_working_set_bytes{namespace="monospaced", pod=~"monospaced-frontend-.*", container!=""})
              / max by (pod, container) (kube_pod_container_resource_limits{namespace="monospaced", pod=~"monospaced-frontend-.*", resource="memory"})
              > 0.9
          for: 5m
          labels:
            severity: critical
            team: monospaced
            service: monospaced-frontend
          annotations:
            summary: "{{ $labels.pod }}/{{ $labels.container }} is above 90% of its memory limit"
