# bitnami/minio helm values. Follows the same pattern as redis/values.yaml —
# helm chart pulled by ArgoCD from bitnami's repo, values kept in git.
mode: standalone

image:
  registry: docker.io
  repository: bitnamilegacy/minio

auth:
  # Credentials come from the eso-managed lens-secret (root user/password).
  # Bitnami's chart reads these keys from the referenced Secret.
  existingSecret: lens-secret
  rootUserSecretKey: MINIO_ROOT_USER
  rootPasswordSecretKey: MINIO_ROOT_PASSWORD

defaultBuckets: "lens-documents"

service:
  type: ClusterIP
  ports:
    api: 9000
    console: 9001

persistence:
  enabled: true
  size: 10Gi

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m

metrics:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
