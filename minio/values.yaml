# bitnami/minio helm values. Follows the same pattern as redis/values.yaml —
# helm chart pulled by ArgoCD from bitnami's repo, values kept in git.
mode: standalone

# Bitnami moved active images to a paid Secure Images registry; the
# community chart falls back to docker.io/bitnamilegacy/* and its NOTES
# hook aborts unless this flag is set. We're fine running the legacy
# tag for now — it still receives CVE fixes.
global:
  security:
    allowInsecureImages: true

image:
  registry: docker.io
  repository: bitnamilegacy/minio

auth:
  # Credentials come from the eso-managed lens-secret (root user/password).
  # Bitnami's chart reads these keys from the referenced Secret.
  existingSecret: lens-secret
  rootUserSecretKey: MINIO_ROOT_USER
  rootPasswordSecretKey: MINIO_ROOT_PASSWORD

# Without these, the console's download button generates URLs relative to
# its own hostname and MinIO rejects the object key with
# "Object name contains unsupported characters".
extraEnvVars:
  - name: MINIO_SERVER_URL
    value: https://s3-minio-lens.rohitpotato.xyz
  - name: MINIO_BROWSER_REDIRECT_URL
    value: https://console-minio-lens.rohitpotato.xyz

defaultBuckets: "lens-documents"

service:
  type: ClusterIP
  ports:
    api: 9000
    console: 9001

persistence:
  enabled: true
  size: 10Gi

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m

metrics:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack

# Web console (port 9001).
ingress:
  enabled: true
  ingressClassName: traefik
  hostname: console-minio-lens.rohitpotato.xyz
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect-https@kubernetescrd
  tls: true
  # cert-manager auto-creates the secret from the annotation.

# S3 API (port 9000) — used for presigned document downloads.
apiIngress:
  enabled: true
  ingressClassName: traefik
  hostname: s3-minio-lens.rohitpotato.xyz
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect-https@kubernetescrd
  tls: true
