installCRDs: true

# Off the control-plane node (no taint, little memory left after k3s).
nodeSelector:
  nodeRole: worker

# Add resource limits for ESO components
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "200m"

certController:
  nodeSelector:
    nodeRole: worker
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

webhook:
  nodeSelector:
    nodeRole: worker
  resources:
    requests:
      memory: "48Mi"
      cpu: "10m"
    limits:
      memory: "128Mi"
