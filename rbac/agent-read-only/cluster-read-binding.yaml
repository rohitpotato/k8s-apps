apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-read-only-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-cluster-read
subjects:
  - kind: ServiceAccount
    name: agent-read-only
    namespace: default
  # The in-cluster agent (agent/ StatefulSet).
  - kind: ServiceAccount
    name: claude-agent
    namespace: agent
