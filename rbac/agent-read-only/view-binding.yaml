# Built-in `view`: read most namespaced objects in every namespace, plus any
# CRD that aggregates into it. Excludes Secrets, pods/exec and port-forward.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-read-only-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: agent-read-only
    namespace: default
