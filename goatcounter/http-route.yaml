apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: goatcounter
  namespace: analytics
spec:
  parentRefs:
    - name: web-gateway
      namespace: default
      sectionName: https-analytics
  hostnames:
    - analytics.rohitpotato.xyz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Robots-Tag
                value: "noindex, nofollow"
      backendRefs:
        - name: goatcounter
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: goatcounter-redirect-http
  namespace: analytics
spec:
  parentRefs:
    - name: web-gateway
      namespace: default
      sectionName: http-analytics
  hostnames:
    - analytics.rohitpotato.xyz
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
