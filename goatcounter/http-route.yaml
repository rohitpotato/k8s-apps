# Serves analytics.rohitpotato.xyz through the shared web-gateway
# (cluster/gateway.yaml, default namespace). The second route below redirects http:// to https.
#
# X-Robots-Tag keeps GoatCounter's own help/code pages out of search results:
# Google had indexed 27 of them under the rohitpotato.xyz domain property,
# more than the blog itself. A header rather than a robots.txt Disallow, so
# crawlers can still fetch the pages and see the noindex. count.js is unaffected.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: goatcounter
  namespace: analytics
spec:
  parentRefs:
    - name: web-gateway
      namespace: default
      sectionName: https-analytics
  hostnames:
    - analytics.rohitpotato.xyz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Robots-Tag
                value: "noindex, nofollow"
      backendRefs:
        - name: goatcounter
          port: 8080
---
# http://analytics.rohitpotato.xyz -> https, on the gateway's http-analytics listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: goatcounter-redirect-http
  namespace: analytics
spec:
  parentRefs:
    - name: web-gateway
      namespace: default
      sectionName: http-analytics
  hostnames:
    - analytics.rohitpotato.xyz
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
