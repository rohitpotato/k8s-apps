# Keeps GoatCounter's own pages (help, docs, login) out of search results.
# Google had indexed 27 of them under the rohitpotato.xyz domain property,
# outnumbering the blog itself. A header rather than robots.txt Disallow,
# so crawlers can still fetch the pages and see the noindex.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: noindex
  namespace: analytics
spec:
  headers:
    customResponseHeaders:
      X-Robots-Tag: "noindex, nofollow"
