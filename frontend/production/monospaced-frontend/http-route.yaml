apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: monospaced-frontend
  namespace: monospaced
spec:
  # Serves the site on the canonical host only; http:// and www redirect to
  # it (redirect-routes.yaml). Argo Rollouts shifts the weights below.
  parentRefs:
    - name: web-gateway
      sectionName: https-root
    # Migration to the shared gateway in default (cluster/gateway.yaml).
    - name: web-gateway
      namespace: default
      sectionName: https-root
  hostnames:
    - rohitpotato.xyz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: monospaced-frontend-stable
          port: 3000
          weight: 100
        - name: monospaced-frontend-canary
          port: 3000
          weight: 0