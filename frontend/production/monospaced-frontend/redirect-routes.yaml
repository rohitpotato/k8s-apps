# Everything that isn't https://rohitpotato.xyz gets a 301 to it, keeping the
# path. Before this, plain http:// had no listener (Traefik answered 404) and
# www served a duplicate copy of the site.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-http-to-https
  namespace: monospaced
spec:
  parentRefs:
    - name: web-gateway
      sectionName: http
  hostnames:
    - rohitpotato.xyz
    # The http listener only takes routes from this namespace, so the
    # analytics redirect lives here rather than next to GoatCounter.
    - analytics.rohitpotato.xyz
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# http:// and https:// www both go straight to the apex in one hop.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-www-to-apex
  namespace: monospaced
spec:
  parentRefs:
    - name: web-gateway
      sectionName: http
    - name: web-gateway
      sectionName: https-www
  hostnames:
    - www.rohitpotato.xyz
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: rohitpotato.xyz
            statusCode: 301
