apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lens-frontend
  namespace: frontend
  labels:
    release: kube-prometheus-stack
spec:
  # Services now labelled `app: lens` (matches rollout pod label). Selector
  # matches the base label; scrapes both lens-stable and lens-canary.
  selector:
    matchLabels:
      app: lens
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
      scheme: http