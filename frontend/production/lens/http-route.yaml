apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  # Name matches `trafficRouting.plugins.argoproj-labs/gatewayAPI.httpRoute`
  # in the Rollout — Rollouts rewrites these weights during canary steps.
  name: lens
  namespace: frontend
spec:
  parentRefs:
    - name: web-gateway
  hostnames:
    - lens.rohitpotato.xyz
    - www.lens.rohitpotato.xyz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: lens-stable
          port: 3000
          weight: 100
        - name: lens-canary
          port: 3000
          weight: 0
