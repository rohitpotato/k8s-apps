apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lens-rohitpotato-xyz
  namespace: frontend
spec:
  secretName: lens-rohitpotato-xyz-tls
  # SAN covers both apex + www so both Gateway listeners resolve.
  dnsNames:
    - lens.rohitpotato.xyz
    - www.lens.rohitpotato.xyz
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
