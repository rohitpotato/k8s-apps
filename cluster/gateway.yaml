apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web-gateway
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  gatewayClassName: traefik
  listeners:
    # Plain HTTP only exists to redirect (see redirect-routes.yaml). Port 8000
    # is Traefik's `web` entrypoint, the way 8443 is `websecure`.
    - name: http
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: monospaced
    - name: https-root
      protocol: HTTPS
      port: 8443
      hostname: rohitpotato.xyz
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: rohitpotato-xyz-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: monospaced
    - name: https-www
      protocol: HTTPS
      port: 8443
      hostname: www.rohitpotato.xyz
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: rohitpotato-xyz-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: monospaced
    - name: http-analytics
      protocol: HTTP
      port: 8000
      hostname: analytics.rohitpotato.xyz
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: analytics
    - name: https-analytics
      protocol: HTTPS
      port: 8443
      hostname: analytics.rohitpotato.xyz
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: analytics-rohitpotato-xyz-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: analytics