crds:
  enabled: true
config:
    enableGatewayAPI: true

# Off the control-plane node (no taint, little memory left after k3s).
nodeSelector:
  nodeRole: worker

# Defaults sized from `kubectl top` (2026-11-03); re-check after a week.
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 192Mi

cainjector:
  nodeSelector:
    nodeRole: worker
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 192Mi

webhook:
  nodeSelector:
    nodeRole: worker
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 96Mi

startupapicheck:
  nodeSelector:
    nodeRole: worker
